services:
  postgres:
    # pgvector 0.8 for halfvec support; Postgres 16 matches Azure Flexible Server.
    image: pgvector/pgvector:0.8.0-pg16
    environment:
      POSTGRES_USER: sift
      POSTGRES_PASSWORD: sift
      POSTGRES_DB: sift
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sift -d sift"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Local stand-in for Azure Storage Queue, so the queue-decoupled ingestion path is
  # exercised in development rather than only in the cloud.
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    command: ["azurite-queue", "--queueHost", "0.0.0.0", "--skipApiVersionCheck"]
    ports:
      - "10001:10001"

volumes:
  pgdata:
