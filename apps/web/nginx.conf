# Serves the built SPA and proxies API traffic to the api container app, so the
# browser sees one origin and no CORS preflight is needed in production.

upstream sift_api {
    # Resolved from the SIFT_API_ORIGIN environment substitution at deploy time; the
    # default matches the Container Apps internal DNS name.
    server api:8000;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed asset filenames are immutable; index.html must never be cached or a
    # deploy leaves clients pinned to a stale bundle.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://sift_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Streaming responses must not be buffered or the client sees nothing until
        # the answer is complete, which defeats the point of streaming.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location = /ready {
        proxy_pass http://sift_api;
        proxy_set_header Host $host;
    }

    # nginx's own liveness, answered without reaching the API.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
