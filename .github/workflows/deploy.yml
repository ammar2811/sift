name: Publish images

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-images
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

# This workflow builds and publishes images. It deliberately does NOT deploy.
#
# Deploying from CI needs a service principal or an OIDC federated credential, and the
# tenant this subscription lives in sets `allowedToCreateApps: false` - students cannot
# register applications, so neither can be created. Rather than keep a deploy job that
# could never authenticate, the release step lives in `scripts/deploy.sh`, which runs
# against an interactive `az login`.
#
# If an app registration is granted later, add a job that logs in with
# azure/login@v2 and calls the same script; nothing else has to change.
jobs:
  images:
    name: Build and push to GHCR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      # Tagged with the commit SHA as well as latest, so a deployed revision always
      # names an immutable image and a rollback means something.
      - name: Build and push the API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/api:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ github.repository }}/api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push the web image
        uses: docker/build-push-action@v6
        with:
          context: apps/web
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/web:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ github.repository }}/web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Images published"
            echo ""
            echo '```'
            echo "$REGISTRY/${{ github.repository }}/api:${{ github.sha }}"
            echo "$REGISTRY/${{ github.repository }}/web:${{ github.sha }}"
            echo '```'
            echo ""
            echo "Deploy with: \`scripts/deploy.sh ${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
